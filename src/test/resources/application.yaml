spring:
  application:
    name: hello-jvm-language-test
  main:
    banner-mode: off
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:mysql://localhost:3306/test?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: root
          password: 12345678
          driver-class-name: com.mysql.cj.jdbc.Driver
        slave:
          url: jdbc:postgresql://localhost:5432/test
          username: postgres
          password: 12345678
          driver-class-name: org.postgresql.Driver
      druid:
        initial-size: 1
        min-idle: 1
        max-active: 5

mybatis-plus:
  banner: false
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.zjw.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: off

xxl:
  job:
    enabled: false
    admin:
      addresses:
    executor:
      appname: hello-jvm-language-test
